name: callcenter-service

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: qstats
      MYSQL_USER: qstats
      MYSQL_PASSWORD: qstatspass
    ports:
      - "3307:3306" # host 3307 -> avoid clashing with any local mysql on 3306
    volumes:
      # Mounted as individual files (not whole directories) so two separate
      # migration folders — qstats (externally-owned PBX schema) and
      # callcenter (this product's own DB, created by its own script via
      # CREATE DATABASE, see migrations/callcenter/001_init.sql) — can both
      # land in the one docker-entrypoint-initdb.d the mysql image scans.
      # Numeric prefixes control run order; only ordering within CALLCENTER's
      # own numbering matters since qstats' init creates a different DB.
      - ./migrations/qstats/001_init.sql:/docker-entrypoint-initdb.d/01_qstats_init.sql:ro
      - ./migrations/callcenter/001_init.sql:/docker-entrypoint-initdb.d/02_callcenter_init.sql:ro
      - ./migrations/callcenter/002_sip_extensions.sql:/docker-entrypoint-initdb.d/03_sip_extensions_init.sql:ro
      - qstats-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for pbx-worker v2 during local testing.
  mock-pbx-worker:
    build:
      context: .
      args:
        CMD_PATH: cmd/mockpbxworker
    environment:
      PORT: "8081"
      HMAC_API_KEY: local-dev-key
      HMAC_SECRET: local-dev-secret
    ports:
      - "8081:8081"

  # Stands in for the Laravel monolith's callback-attempt endpoint during
  # local testing (the one write-path this service calls out to).
  mock-laravel:
    build:
      context: .
      args:
        CMD_PATH: cmd/mocklaravel
    environment:
      PORT: "8082"
      CALLBACK_PATH: /api/internal/call-center/callback-attempts
      HMAC_API_KEY: local-dev-key
      HMAC_SECRET: local-dev-secret
    ports:
      - "8092:8082" # host 8092: 8082 is taken by an existing local stack (laravelcrm2_local_phpmyadmin) on this machine

  callcenter-service:
    build:
      context: .
      args:
        CMD_PATH: cmd/server
    environment:
      APP_ENV: local
      HTTP_PORT: "8080"

      # End-user auth (browser -> this service). LOCAL DEV VALUES ONLY.
      # The service refuses to start without JWT_SECRET, deliberately: a
      # generated-at-startup fallback works in dev and then invalidates every
      # session on each deploy.
      JWT_SECRET: local-dev-jwt-secret-change-me
      JWT_TTL_SECONDS: "28800"
      DEV_ADMIN_PASSWORD: admin123
      DEV_AGENT_PASSWORD: agent123

      # The Angular dev server is a different origin, so it needs an explicit
      # allow-list entry.
      CORS_ORIGINS: "http://localhost:4200"

      # Service-to-service inbound HMAC. Nothing calls in this way yet; kept
      # for when Laravel needs to.
      INCOMING_HMAC_API_KEY: local-dev-key
      INCOMING_HMAC_SECRET: local-dev-secret

      QSTATS_DSN: "qstats:qstatspass@tcp(mysql:3306)/qstats?parseTime=true"

      # This product's own DB (call_logs). Uses the SAME mysql container as
      # qstats above for local dev only — see migrations/callcenter's own
      # doc comment. root/rootpass because 002_callcenter_init.sql created
      # this database itself; the qstats user/password only has grants on
      # the qstats database.
      CALLCENTER_DSN: "root:rootpass@tcp(mysql:3306)/callcenter?parseTime=true"

      # The REAL staging pbx-worker (confirmed live in docs/extraction-plan.md's
      # HMAC verification — reads AND writes go here now, not the local
      # mock). PBX_CONTROL_* below defaults to these same values when unset
      # (see config.go) — kept explicit here anyway so both are visible
      # together at a glance.
      PBX_WORKER_MODE: hmac
      PBX_WORKER_BASE_URL: "https://sbc.wevetel.com/wevetel-pbx-worker"
      PBX_WORKER_API_KEY: client_c67caafcfa9ecd9d
      PBX_WORKER_SECRET: c02271da9ff0c57695b4b9db53c120a756024bb2960347cce863ff4a250d087d

      # pbx-worker's LIVE control surface (queue/agent snapshots + AMI
      # commands) — same host, same credentials as PBX_WORKER_* above.
      PBX_CONTROL_BASE_URL: "https://sbc.wevetel.com/wevetel-pbx-worker"
      PBX_CONTROL_API_KEY: client_c67caafcfa9ecd9d
      PBX_CONTROL_SECRET: c02271da9ff0c57695b4b9db53c120a756024bb2960347cce863ff4a250d087d

      LARAVEL_CALLBACK_BASE_URL: "http://mock-laravel:8082"
      LARAVEL_CALLBACK_PATH: /api/internal/call-center/callback-attempts
      LARAVEL_CALLBACK_API_KEY: local-dev-key
      LARAVEL_CALLBACK_SECRET: local-dev-secret

      # Softphone. There is no PBX in this local stack, so these coordinates
      # are unreachable — fine, because the Angular dev environment defaults
      # to FakeSipEngine (no network at all). They exist so GET
      # secure/softphone/bootstrap has something real to return: an agent
      # signing in locally sees "Registered as 1001" in the panel, matching
      # what a real deployment would show, even though the fake engine never
      # actually dials out. Now pointed at the real staging PBX (same host
      # confirmed live in docs/extraction-plan.md's HMAC verification) —
      # environment.sipEngine in the Angular app must be 'jssip' for this to
      # mean anything; on 'fake' (the default) no network call is made
      # regardless of what this points at.
      SOFTPHONE_PBX_HOST: sbc.wevetel.com
      SOFTPHONE_PBX_WS_PORT: "8089"
      SOFTPHONE_PBX_WS_PATH: /ws
      SOFTPHONE_PBX_TRANSPORT: wss
      # DEV_SIP_EXTENSION seeding is OFF: the admin account now holds a real
      # extension (5955) assigned via the admin API, not the dev seed — see
      # main.go's own seeding guard, which only seeds when no row exists yet
      # for that account, so leaving this unset here does not touch it.

      # SIP extension passwords are encrypted at rest with this key (see
      # internal/softphone/crypto.go). LOCAL DEV VALUE ONLY — generate a
      # real one with `openssl rand -base64 32` for any real deployment,
      # and never commit it.
      SIP_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mock-pbx-worker:
        condition: service_started
      mock-laravel:
        condition: service_started

volumes:
  qstats-data:
